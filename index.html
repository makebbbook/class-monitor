<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수업 화면 모니터</title>
<style>
:root{
  --bg:#f4f1ec; --panel:#ffffff; --ink:#2b2622; --sub:#7a6f66; --line:#e3ddd5;
  --accent:#e08a2e; --ok:#3aa86b; --bad:#d0533f; --idle:#b8afa6; --tile:#1d1a17;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{display:flex;align-items:center;gap:10px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
h1{font-size:20px;margin:0;line-height:1}
.count{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 14px;border-radius:15px;background:#fff3e6;color:var(--accent);font-weight:700;font-size:14px;line-height:1}
.count.alert{background:#fdeae6;color:var(--bad)}
.spacer{flex:1}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;font-size:14px;font-weight:600;line-height:1;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.on{background:#fff3e6;border-color:var(--accent);color:var(--accent)}
.colsel{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--sub)}
select,input{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font:inherit;font-size:14px;background:#fff;color:var(--ink)}
main{padding:18px 20px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(var(--cols,5),1fr)}
.tile{background:var(--panel);border:2px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.tile.down{border-color:var(--bad);animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{border-color:#f3c2b8}}
.tile .top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px}
.name{display:inline-flex;align-items:center;justify-content:center;height:26px;padding:0 12px;border-radius:13px;background:#f1ece6;font-size:13px;font-weight:700;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
.state{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:700;line-height:1;color:#fff;background:var(--idle);white-space:nowrap}
.state::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;flex:none}
.state.ok{background:var(--ok)} .state.bad{background:var(--bad)}
.screen{position:relative;aspect-ratio:16/10;background:var(--tile);cursor:zoom-in}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;background:var(--tile)}
.screen .msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#cfc6bd;font-size:13px;text-align:center;padding:10px}
.screen .msg b{color:#fff;font-size:14px}
.screen .msg .since{display:inline-flex;align-items:center;justify-content:center;height:22px;padding:0 10px;border-radius:11px;background:rgba(208,83,63,.25);color:#ffb7a9;font-size:12px;font-weight:700;line-height:1}
.modal{position:fixed;inset:0;background:rgba(20,16,12,.72);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal.on{display:flex}
.big{width:min(1400px,96vw);background:var(--panel);border-radius:16px;overflow:hidden}
.big .top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.big .screen{cursor:default}
.settings,.logbox{width:min(760px,96vw);max-height:90vh;overflow:auto;background:var(--panel);border-radius:16px;padding:20px}
.settings h2,.logbox h2{margin:0 0 6px;font-size:18px}
.settings p,.logbox p{margin:0 0 14px;color:var(--sub);font-size:13px;line-height:1.6}
.row{display:grid;grid-template-columns:60px 1fr 110px;gap:8px;align-items:center;margin-bottom:8px}
.row .num{display:inline-flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:15px;background:#f1ece6;font-weight:700;font-size:13px;line-height:1}
.row.head{font-size:12px;color:var(--sub);font-weight:700}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;position:sticky;bottom:-20px;background:var(--panel);padding:12px 0 4px}
.log{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;max-height:55vh;overflow:auto}
.log li{display:grid;grid-template-columns:80px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
.log li:last-child{border-bottom:0}
.log .t{color:var(--sub);font-variant-numeric:tabular-nums}
.log .tag{display:inline-flex;align-items:center;justify-content:center;height:22px;padding:0 10px;border-radius:11px;font-size:12px;font-weight:700;line-height:1;color:#fff}
.log .tag.ok{background:var(--ok)} .log .tag.bad{background:var(--bad)}
.log .empty{display:block;text-align:center;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:none;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:22px;background:var(--bad);color:#fff;font-weight:700;font-size:15px;line-height:1;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.on{display:inline-flex}
</style>
</head>
<body>
<header>
  <h1>📖 수업 화면 모니터</h1>
  <span class="count" id="count">연결 0 / 0</span>
  <span class="spacer"></span>
  <label class="colsel">한 줄에
    <select id="cols"><option>3</option><option>4</option><option selected>5</option><option>6</option></select>
  </label>
  <button id="sound" class="on">🔔 끊김 알림 켜짐</button>
  <button id="openLog">📋 기록</button>
  <button id="refresh">↻ 다시 연결</button>
  <button class="primary" id="openSet">⚙ 탭 설정</button>
</header>
<main><div class="grid" id="grid"></div></main>

<div class="toast" id="toast"></div>

<div class="modal" id="bigModal"><div class="big">
  <div class="top"><span class="name" id="bigName"></span><button id="closeBig">닫기</button></div>
  <div class="screen" id="bigScreen"></div>
</div></div>

<div class="modal" id="setModal"><div class="settings">
  <h2>탭 설정</h2>
  <p>패드 뒷면에 번호 스티커를 붙이고, 번호마다 ScreenStream 앱에 나오는 주소(예: <b>192.168.0.21</b>)를 적어 주세요. 포트는 보통 <b>8080</b>이에요.<br>비워 둔 칸은 화면에 나오지 않아요.</p>
  <div class="row head"><span>번호</span><span>IP 주소</span><span>포트</span></div>
  <div id="rows"></div>
  <div class="actions"><button id="cancelSet">취소</button><button class="primary" id="saveSet">저장</button></div>
</div></div>

<div class="modal" id="logModal"><div class="logbox">
  <h2>오늘의 연결 기록</h2>
  <p>탭이 끊기거나 다시 연결된 시각이 남아요. 공유를 일부러 끈 탭을 확인할 때 써 주세요.</p>
  <ul class="log" id="log"></ul>
  <div class="actions"><button id="clearLog">기록 지우기</button><button id="saveLog">파일로 저장</button><button class="primary" id="closeLog">닫기</button></div>
</div></div>

<script>
const MAX=16, KEY='classMonitor.v1', LOGKEY='classMonitor.log.'+new Date().toLocaleDateString('sv');
let tabs=[], soundOn=true, logs=[];
const status={}; // i -> {alive, since}
const $=id=>document.getElementById(id);

function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&Array.isArray(s.tabs)){tabs=s.tabs;$('cols').value=s.cols||'5';soundOn=s.sound!==false;}}catch(e){}
  if(!tabs.length)tabs=Array.from({length:MAX},()=>({ip:'',port:'8080'}));
  while(tabs.length<MAX)tabs.push({ip:'',port:'8080'});
  try{logs=JSON.parse(localStorage.getItem(LOGKEY)||'[]')}catch(e){logs=[]}
  paintSound();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({tabs,cols:$('cols').value,sound:soundOn}))}catch(e){}}
function saveLogs(){try{localStorage.setItem(LOGKEY,JSON.stringify(logs))}catch(e){}}
const url=t=>`http://${t.ip.trim()}:${(t.port||'8080').trim()}/`;
const active=()=>tabs.map((t,i)=>({...t,i})).filter(t=>t.ip.trim());
const nameOf=t=>(t.i+1)+'번';
const hm=d=>d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});

/* 알림음 */
let actx;
function beep(){
  if(!soundOn)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    [0,0.25].forEach(off=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type='sine';o.frequency.value=880;o.connect(g);g.connect(actx.destination);
      const t0=actx.currentTime+off;
      g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.3,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.2);
      o.start(t0);o.stop(t0+0.22);
    });
  }catch(e){}
}
function paintSound(){const b=$('sound');b.className=soundOn?'on':'';b.textContent=soundOn?'🔔 끊김 알림 켜짐':'🔕 끊김 알림 꺼짐'}
let toastT;
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),5000)}

/* 기록 */
function addLog(t,ok){
  logs.unshift({time:Date.now(),name:nameOf(t),ok});
  if(logs.length>500)logs.length=500;
  saveLogs();
  if($('logModal').classList.contains('on'))renderLog();
}
function renderLog(){
  const ul=$('log');ul.innerHTML='';
  if(!logs.length){ul.innerHTML='<li><span class="empty" style="grid-column:1/-1">아직 기록이 없어요</span></li>';return}
  logs.forEach(l=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="t">${hm(new Date(l.time))}</span><span class="n"></span><span class="tag ${l.ok?'ok':'bad'}">${l.ok?'다시 연결':'끊김'}</span>`;
    li.querySelector('.n').textContent=l.name;ul.appendChild(li);
  });
}

function render(){
  const g=$('grid');
  g.style.setProperty('--cols',$('cols').value);
  g.innerHTML='';
  const list=active();
  if(!list.length){
    g.innerHTML='<div class="tile" style="grid-column:1/-1"><div class="screen" style="cursor:default"><div class="msg"><b>아직 등록된 탭이 없어요</b>오른쪽 위 ⚙ 탭 설정에서 탭 주소를 넣어 주세요</div></div></div>';
  }
  list.forEach(t=>{
    const el=document.createElement('div');el.className='tile';el.id='tile'+t.i;
    el.innerHTML=`<div class="top"><span class="name"></span><span class="state" id="st${t.i}">확인 중</span></div>
      <div class="screen"><div class="msg" id="msg${t.i}"><b>연결 중…</b></div><iframe id="fr${t.i}" loading="lazy"></iframe></div>`;
    el.querySelector('.name').textContent=nameOf(t);
    el.querySelector('.screen').onclick=()=>openBig(t);
    g.appendChild(el);
  });
  checkAll(true);
}

async function ping(t){
  const c=new AbortController();const to=setTimeout(()=>c.abort(),3000);
  try{await fetch(url(t),{mode:'no-cors',signal:c.signal,cache:'no-store'});return true}catch(e){return false}finally{clearTimeout(to)}
}
async function checkAll(reload){
  const list=active();let ok=0;const newlyDown=[];
  await Promise.all(list.map(async t=>{
    const alive=await ping(t);
    const st=$('st'+t.i),fr=$('fr'+t.i),msg=$('msg'+t.i),tile=$('tile'+t.i);
    if(!st)return;
    const prev=status[t.i];
    if(!prev||prev.alive!==alive){
      status[t.i]={alive,since:Date.now()};
      if(prev){ if(!alive)newlyDown.push(t); addLog(t,alive); }
    }
    if(alive){ok++;st.className='state ok';st.textContent='연결됨';tile.classList.remove('down');
      if(reload||!fr.src){fr.src=url(t)} fr.style.display='block';msg.style.display='none';}
    else{
      st.className='state bad';st.textContent='끊김';fr.removeAttribute('src');fr.style.display='none';
      if(prev)tile.classList.add('down');
      msg.style.display='flex';
      msg.innerHTML=`<b>화면이 안 들어와요</b>탭에서 ScreenStream이 켜져 있는지 확인해 주세요<span class="since">${hm(new Date(status[t.i].since))}부터 끊김</span>`;
    }
  }));
  const c=$('count');c.textContent=`연결 ${ok} / ${list.length}`;c.classList.toggle('alert',ok<list.length);
  if(newlyDown.length){beep();toast(`⚠ ${newlyDown.map(nameOf).join(', ')} 화면이 끊겼어요`)}
}

function openBig(t){
  $('bigName').textContent=nameOf(t);
  $('bigScreen').innerHTML=`<iframe src="${url(t)}"></iframe>`;
  $('bigModal').classList.add('on');
}
$('closeBig').onclick=()=>{$('bigModal').classList.remove('on');$('bigScreen').innerHTML=''};

function openSet(){
  const r=$('rows');r.innerHTML='';
  tabs.forEach((t,i)=>{
    const d=document.createElement('div');d.className='row';
    d.innerHTML=`<span class="num">${i+1}번</span><input data-k="ip" placeholder="예: 192.168.0.21"><input data-k="port" placeholder="8080">`;
    d.querySelectorAll('input').forEach(inp=>inp.value=t[inp.dataset.k]||'');
    r.appendChild(d);
  });
  $('setModal').classList.add('on');
}
$('openSet').onclick=openSet;
$('cancelSet').onclick=()=>$('setModal').classList.remove('on');
$('saveSet').onclick=()=>{
  tabs=[...document.querySelectorAll('#rows .row')].map(row=>{const o={};row.querySelectorAll('input').forEach(inp=>o[inp.dataset.k]=inp.value.trim());if(!o.port)o.port='8080';return o});
  for(const k in status)delete status[k];
  save();$('setModal').classList.remove('on');render();
};
$('sound').onclick=()=>{soundOn=!soundOn;paintSound();save();if(soundOn)beep()};
$('openLog').onclick=()=>{renderLog();$('logModal').classList.add('on')};
$('closeLog').onclick=()=>$('logModal').classList.remove('on');
$('clearLog').onclick=()=>{logs=[];saveLogs();renderLog()};
$('saveLog').onclick=()=>{
  const day=new Date().toLocaleDateString('sv');
  const txt='시각,번호,상태\n'+logs.slice().reverse().map(l=>`${new Date(l.time).toLocaleTimeString('ko-KR',{hour12:false})},${l.name},${l.ok?'다시 연결':'끊김'}`).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+txt],{type:'text/csv'}));a.download=`연결기록_${day}.csv`;a.click();
};
$('refresh').onclick=()=>render();
$('cols').onchange=()=>{save();render()};
load();render();
setInterval(()=>checkAll(false),10000);
</script>
</body>
</html>
